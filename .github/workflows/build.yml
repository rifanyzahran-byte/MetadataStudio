
name: Build Metadata Studio Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MetadataStudio MetadataStudio_ReadyBuild/MetadataStudio.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MetadataStudio-Windows
          path: dist/MetadataStudio.exe
